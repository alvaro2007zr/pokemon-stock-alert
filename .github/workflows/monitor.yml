name: Pokemon Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Check shops
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          from bs4 import BeautifulSoup

          shops = {
              "GAME": "https://www.game.es/caja-ultra-premium-de-cartas-pokemon-30-aniversario-castellano-surtido/266954",
              "Carrefour": "https://www.carrefour.es/pokemon-caja-ultra-premium-30th-aniversario-6-anos-unboxing/VC4A-34535253/p"
          }

          positives = [
              "añadir al carrito",
              "añadir a la cesta",
              "en stock",
              "disponible",
              "comprar"
          ]

          negatives = [
              "agotado",
              "sin stock",
              "no disponible",
              "temporalmente no disponible"
          ]

          alerts = []

          for shop, url in shops.items():
              try:
                  response = requests.get(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"},
                      timeout=20
                  )
                  response.raise_for_status()

                  text = BeautifulSoup(
                      response.text, "html.parser"
                  ).get_text(" ", strip=True).lower()

                  if any(word in text for word in negatives):
                      print(f"{shop}: sin disponibilidad confirmada")
                  elif any(word in text for word in positives):
                      print(f"{shop}: posible disponibilidad")
                      alerts.append(f"{shop}: posible stock\n{url}")
                  else:
                      print(f"{shop}: estado desconocido")

              except Exception as error:
                  print(f"Error en {shop}: {error}")

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if alerts and token and chat_id:
              message = "🎉 Posible stock de Pokémon:\n\n" + "\n\n".join(alerts)
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={"chat_id": chat_id, "text": message},
                  timeout=20
              ).raise_for_status()
          PY
