
name: Pokemon Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install requests beautifulsoup4

      - name: Comprobar GAME y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from bs4 import BeautifulSoup

          url = "https://www.game.es/caja-ultra-premium-de-cartas-pokemon-30-aniversario-castellano-surtido/266954"
          state_file = "game_stock_state.txt"

          headers = {"User-Agent": "Mozilla/5.0"}

          try:
              response = requests.get(url, headers=headers, timeout=25)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, "html.parser")
              text = soup.get_text(" ", strip=True).lower()

              available = False

              # Buscar disponibilidad explícita en los datos estructurados.
              def inspect_json(data):
                  global available
                  if isinstance(data, dict):
                      availability = str(data.get("availability", "")).lower()
                      if availability.endswith("instock") or "instock" in availability:
                          available = True
                      for value in data.values():
                          inspect_json(value)
                  elif isinstance(data, list):
                      for value in data:
                          inspect_json(value)

              for tag in soup.find_all("script", type="application/ld+json"):
                  try:
                      inspect_json(json.loads(tag.string or tag.get_text()))
                  except (json.JSONDecodeError, TypeError):
                      pass

              # Comprobar botones de compra, no palabras sueltas de la descripción.
              for element in soup.find_all(["button", "a"]):
                  label = element.get_text(" ", strip=True).lower()
                  if any(term in label for term in [
                      "añadir al carrito",
                      "añadir a la cesta",
                      "comprar ahora"
                  ]):
                      available = True

              if "agotado" in text:
                  available = False

              previous = "unknown"
              if os.path.exists(state_file):
                  with open(state_file, "r") as file:
                      previous = file.read().strip()

              current = "available" if available else "not_available"

              print("GAME:", current)
              print("Estado anterior:", previous)

              if current == "available" and previous != "available":
                  message = (
                      "¡GAME podría tener stock de la Caja Ultra Premium "
                      "Pokémon 30.º Aniversario!\n\n"
                      "Comprueba la disponibilidad aquí:\n" + url
                  )

                  result = requests.post(
                      f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                      data={
                          "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                          "text": message
                      },
                      timeout=20
                  )
                  result.raise_for_status()
                  print("Aviso enviado a Telegram.")

              with open(state_file, "w") as file:
                  file.write(current)

          except Exception as error:
              print("No se ha podido comprobar GAME:", error)
              raise
          PY

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_stock_state.txt
          git diff --cached --quiet || git commit -m "Actualizar estado de stock"
          git push
