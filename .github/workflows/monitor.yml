
name: Pokemon Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Inspect GAME availability
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          import re

          url = "https://www.game.es/caja-ultra-premium-de-cartas-pokemon-30-aniversario-castellano-surtido/266954"

          try:
              response = requests.get(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"},
                  timeout=20
              )
              response.raise_for_status()

              soup = BeautifulSoup(response.text, "html.parser")

              print("ESTADO HTTP:", response.status_code)

              print("\n--- INDICADORES EN EL TEXTO ---")
              text = soup.get_text(" ", strip=True).lower()

              terms = [
                  "avisa cuando haya stock",
                  "añadir al carrito",
                  "añadir",
                  "agotado",
                  "sin stock",
                  "disponible",
                  "no disponible",
                  "consulta disponibilidad"
              ]

              for term in terms:
                  positions = [
                      m.start() for m in re.finditer(
                          re.escape(term), text
                      )
                  ]
                  print(f"{term}: {len(positions)} coincidencias")
                  for position in positions[:2]:
                      print(text[max(0, position-150):position+250])

              print("\n--- DATOS DE PRODUCTO ---")
              for tag in soup.find_all("script", type="application/ld+json"):
                  print(tag.get_text()[:3000])

          except Exception as error:
              print("ERROR:", error)
          PY
